services:
  - type: web
    name: toki.nishiyama-project-3
    env: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://toki-nishiyama-project-2.onrender.com  # ← 実際のバックエンドURLに変更！
