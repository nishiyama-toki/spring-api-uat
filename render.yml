services:
  - type: web
    name: toki.nishiyama-project-3
    runtime: node  # ← これが正解！
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://toki-nishiyama-project-4-batsukuendo.onrender.com  # 実際のバックエンドURL