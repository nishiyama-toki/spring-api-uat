# ================================
# アプリケーション設定
# ================================
spring.application.name=api
server.port=8080

# ================================
# DB接続設定（PostgreSQL）
# evaluation データベースを使用
spring.datasource.url=jdbc:postgresql://db:5432/evaluation
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- ※切替用：mydb を使いたいときは下記を有効化 ---
# spring.datasource.url=jdbc:postgresql://db:5432/mydb
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# ================================
# JPA / Hibernate設定
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=evaluation

# SQLログ出力設定
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ================================
# JWT設定
# ================================
jwt.secret=super-secret-dev-key
jwt.secret=your_super_secret_key_123!

# ================================
# メール設定（Mailpit用）
# ================================
spring.mail.from=no-reply@example.com
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ================================
# フロントエンド連携設定
# ================================
app.frontend.url=http://localhost:3000
# app.reset.base-url=http://localhost:3000/reset_password
# ※上記はメールでのパスワード再設定リンク用（必要に応じて有効化）
