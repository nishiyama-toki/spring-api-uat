# ================================
# アプリケーション設定
# ================================
spring.application.name=api
server.port=8080

# ================================
# DB接続設定（PostgreSQL）
# evaluation データベースを使用
spring.datasource.url=jdbc:postgresql://db:5432/evaluation
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPAの設定（必要に応じて） ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.security.debug=true

# --- JPA設定 ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=evaluation

# SQLログ出力設定
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.security.debug=true

# ===== JWT設定 =====
jwt.secret=super-secret-dev-key
jwt.secret=your_super_secret_key_123!

# ================================
# メール設定（Mailpit用）
# ================================
spring.mail.from=no-reply@example.com

# Mailpit用SMTP設定
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ================================
# フロントエンド連携設定
# ================================
app.frontend.url=http://localhost:3000
# app.reset.base-url=http://localhost:3000/reset_password
# メール送信は、app.reset.base-urlっていう変数を共通化してreset_passwordっていう後ろのURLを処理に組み込む
# app.reset.base-urlをfront-urlのように
app.reset.base-url=http://localhost:3000/reset_password
