# --- アプリケーション名 ---
spring.application.name=api

# --- DB接続設定 ---
spring.datasource.url=jdbc:postgresql://db:5432/mydb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=evaluation

# --- JPA設定 ---
spring.jpa.hibernate.ddl-auto=update
spring.security.debug=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ===== JWT設定 =====
jwt.secret=super-secret-dev-key

# メール送信元
spring.mail.from=no-reply@example.com

# Mailpit用SMTP設定
# Dockerホストにアクセスする場合
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# フロントエンドのベース URL（どの画面でも共通）
app.frontend.url=http://localhost:3000
# パスワード再設定リンクのベースURL（Next.js 側）
# app.reset.base-url=http://localhost:3000/reset_password
# メール送信は、app.reset.base-urlっていう変数を共通化してreset_passwordっていう後ろのURLを処理に組み込む
# app.reset.base-urlをfront-urlのように


